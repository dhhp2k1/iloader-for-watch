name: Build iLoader with Watch support

on:
  push:
    branches: [watch-v2.4.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: watch-windows-${{ hashFiles('src-tauri/Cargo.lock', 'vendor/isideload/Cargo.toml') }}
      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check dependency lock
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > $null
      - name: Build portable Windows application
        run: bun run tauri build --no-bundle --config src-tauri/ci.conf.json -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: iloader-2.4.1-watch-windows-x64
          path: src-tauri/target/release/iloader.exe
          if-no-files-found: error
